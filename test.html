<!DOCTYPE html>
<html>
<head>
  <title>Square Puzzle</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #f0f4ff, #e8f9f1);
      color: #333;
    }

    h1 {
      color: #2a3d66;
    }
    #timerDisplay {
  font-size: 32px;
  font-weight: bold;
  margin: 10px 0;
  text-align: center;
}

#boardWrapper {
  position: relative;
  display: inline-block;
}

#topLabels {
  display: grid;
  grid-template-columns: repeat(6, 60px);
  margin-left: 20px; /* matches board padding */
  margin-bottom: 6px;
  text-align: center;
  font-weight: bold;
  font-size: 20px;
}

#leftLabels {
  position: absolute;
  top: 50px; /* matches board padding */
  left: -30px;
  display: grid;
  grid-template-rows: repeat(6, 60px);
  height: 360px;
  align-items: center;
  font-weight: bold;
  font-size: 20px;
}
    #board {
      display: grid;
      grid-template-columns: repeat(6, 60px);
      grid-template-rows: repeat(6, 60px);
      gap: 0px;
      margin: 25px auto;
      width: max-content;
      animation: boardGlow 4s ease-in-out infinite;
      /* 3D board effect */
      background: #ffffff;
      padding: 20px; 
      border-radius: 15px;
      box-shadow: 
        0 4px 8px rgba(0,0,0,0.15),
        inset 0 0 10px rgba(0,0,0,0.05);
    }

   
@keyframes boardGlow {
  0%   { box-shadow: 0 4px 8px rgba(0,0,0,0.15), inset 0 0 10px rgba(0,0,0,0.05); }
  50%  { box-shadow: 0 6px 14px rgba(0,0,0,0.25), inset 0 0 14px rgba(0,0,0,0.08); }
  100% { box-shadow: 0 4px 8px rgba(0,0,0,0.15), inset 0 0 10px rgba(0,0,0,0.05); }
}

    .cell {
      width: 60px;
      height: 60px;
      background: #fafafa;
      border-radius: 8px;
      border: 1px solid #d0d0d0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: background 0.2s, transform 0.2s;
    }
.barrier {
  background: #000;              /* pure black */
  border-color: #000;
  box-shadow: inset 0 0 10px rgba(255,255,255,0.15);
}
    
    .highlight {
      background: #ffe066;
      border-color: #ffcc33;
      transform: translateY(-3px);
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      font-weight: bold;
    }
    .hover {
  background: #c7ff8a;
  border-color: #8cd95b;
  transform: translateY(-2px);
}

    button {
      padding: 12px 25px;
      font-size: 1.2rem;
      margin-top: 20px;
      cursor: pointer;
      background: #4a6fa5;
      color: white;
      border: none;
      border-radius: 8px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      transition: background 0.2s;
    }

    button:hover {
      background: #3b5a85;
    }

  #results {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
  }

  .die {
    background: white;
    padding: 8px 12px;
    border-radius: 10px;
    box-shadow: 0 0 6px rgba(0,0,0,0.15);
    font-size: 0.9rem;
    display: inline-block;
  }
 #toolbox {
   display: none;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
  margin: 25px auto;
  max-width: 420px;
   position: relative;
}

.piece {
  position: absolute;
  display: flex;
  flex-wrap: wrap;
  cursor: grab;
  touch-action: none;
  transition: transform 0.15s ease;
}

    .piece.lifted {
  transform: translateY(-20px) scale(1.15);
  z-index: 9999;
}

.block {
  width: 60px;
  height: 60px;
  border-radius: 8px;
  box-shadow:
    inset 0 4px 6px rgba(255,255,255,0.6),
    inset 0 -4px 6px rgba(0,0,0,0.25),
    0 4px 8px rgba(0,0,0,0.25);
}
    #puzzleOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#puzzlePanel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: 80%;
    max-width: 600px;
    text-align: center;
}
  </style>
</head>

<body>
  <h1>Square Puzzle <span id="puzzleNumberHeader"></span></h1>
  <button onclick="showPuzzleSelect()">Puzzle Selection</button>
  <div id="puzzleOverlay">
    <div id="puzzlePanel">
        <h2>Select a Puzzle</h2>

        <div id="puzzleButtons"></div>

        <div id="puzzleNavBar"></div>   <!-- NEW: navigation + reset buttons -->

        <button onclick="closePuzzleOverlay()">Close</button>
    </div>
</div>

  <div id="timerDisplay">0.0s</div>
  <!-- <button onclick="rollAll()">Start Game (Set random Barriers)🎲</button>  -->
  

  <div id="results"></div>
 <div id="debugPanel" style="display:none;"></div>
<div id="boardWrapper">
  <div id="topLabels">
    <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span>
  </div>

  <div id="leftLabels">
    <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span>
  </div>

  <div id="board"></div>
</div>
  <div id="winMessage" style="margin-top:10px; font-size:20px; font-weight:bold; height: 30px;line-height: 30px;text-align: center;"></div>

<div id="toolbox"></div>
  <script>
    let currentPuzzle = null
    let gameOver = false;
    let puzzleProgress = JSON.parse(localStorage.getItem("puzzleProgress") || "{}");
    const shapes = {
  one: {
    rotations: [[[0,0]]],
    colors: ["#4d96ff"] // blue
  },
  twoLine: {
    rotations: [
      [[0,0],[0,1]],
      [[0,0],[1,0]]
    ],
    colors: ["#A97458"] // brown
  },
  threeLine: {
    rotations: [
      [[0,0],[0,1],[0,2]],
      [[0,0],[1,0],[2,0]]
    ],
    colors: ["#FFA500"] // orange
  },
threeL: {
  rotations: [
    // Hole: top-left
    [[1,0],[0,1],[1,1]],

    // Hole: top-right
    [[0,0],[0,1],[1,1]],

    // Hole: bottom-right
    [[0,0],[1,0],[0,1]],

    // Hole: bottom-left
    [[0,0],[1,0],[1,1]]
  ],
  colors: ["#9b5de5"] // purple
},
  fourLine: {
    rotations: [
      [[0,0],[0,1],[0,2],[0,3]],
      [[0,0],[1,0],[2,0],[3,0]]
    ],
    colors: ["#a8e6a3"] // light green
  },
  square4: {
    rotations: [
      [[0,0],[0,1],[1,0],[1,1]]
    ],
    colors: ["#2e7d32"] // dark green
  },
  fourL: {
  rotations: [
    // Original L
    [[0,0],[1,0],[2,0],[2,1]],
    [[0,1],[0,0],[0,2],[1,0]],
    [[0,0],[0,1],[1,1],[2,1]],
    [[1,0],[1,1],[1,2],[0,2]],

    // Mirrored L
    [[0,1],[1,1],[2,1],[2,0]],
    [[0,0],[1,0],[1,1],[1,2]],
    [[0,0],[0,1],[1,0],[2,0]],
    [[0,0],[0,1],[0,2],[1,2]]
  ],
    colors: ["#00bbf9"] // cyan
  },
  fourT: {
    rotations: [
      [[0,0],[0,1],[0,2],[1,1]],
      [[0,1],[1,1],[2,1],[1,0]],
      [[1,0],[1,1],[1,2],[0,1]],
      [[0,0],[1,0],[2,0],[1,1]]
    ],
    colors: ["#fee440"] // bright yellow
  },
  fourZ: {
  rotations: [
    // Z shape
    [[0,0],[0,1],[1,1],[1,2]],
    [[0,1],[1,1],[1,0],[2,0]],

    // S shape (mirror)
    [[0,1],[0,2],[1,0],[1,1]],
    [[0,0],[1,0],[1,1],[2,1]]
  ],
    colors: ["#ff6b6b"] // red
  }
};
    const dice = [
      { name: "Die 1", faces: ["F2", "A5", "F2", "A5", "E1", "B6"] },
      { name: "Die 2", faces: ["F6", "A4", "D6", "C5", "C6", "B5"] },
      { name: "Die 3", faces: ["B2", "B1", "A3", "A2", "C2", "B3"] },
      { name: "Die 4", faces: ["D4", "B4", "E3", "C4", "C3", "D3"] },
      { name: "Die 5", faces: ["E6", "E5", "E4", "D5", "F5", "F4"] },
      { name: "Die 6", faces: ["C1", "A1", "D2", "D1", "F3", "E2"] },
      { name: "Die 7", faces: ["F1", "A6", "F1", "A6", "F1", "A6"] }
    ];

    const rows = ["A","B","C","D","E","F"];
    const cols = ["1","2","3","4","5","6"];
    
let timer = 0;            // milliseconds
let timerInterval = null; // setInterval handle
let timerRunning = false; // prevents double-start
function resetAllProgress() {
    if (!confirm("Reset ALL puzzle progress?")) return;

    puzzleProgress = {};
    localStorage.removeItem("puzzleProgress");

    showPuzzleSelect(); // refresh menu
}

function jumpToFirstUnsolved() {
    const total = allPuzzles.length;

    for (let i = 1; i <= total; i++) {
        const progress = puzzleProgress[i];
        if (!progress || !progress.solved) {
            // Found the first unsolved puzzle
            const puzzlesPerPage = 25;
            const page = Math.ceil(i / puzzlesPerPage);
            showPuzzleSelect(page);
            return;
        }
    }

    // If all puzzles are solved
    alert("All puzzles solved!");
}
function showPuzzleSelect(page = 1) {
    const container = document.getElementById("puzzleButtons");
    container.innerHTML = ""; 

    const puzzlesPerPage = 25;
    const startIndex = (page - 1) * puzzlesPerPage;
    const endIndex = Math.min(startIndex + puzzlesPerPage, allPuzzles.length);

    // --- 5×5 GRID FOR PUZZLES ---
    container.style.display = "grid";
    container.style.gridTemplateColumns = "repeat(5, 1fr)";
    container.style.gap = "12px";

    for (let i = startIndex; i < endIndex; i++) {
        const puzzleNum = i + 1;
        const progress = puzzleProgress[puzzleNum];

        const btn = document.createElement("button");
        btn.style.width = "100px";
        btn.style.height = "100px";
        btn.style.display = "flex";
        btn.style.flexDirection = "column";
        btn.style.justifyContent = "center";
        btn.style.alignItems = "center";
        btn.style.fontSize = "18px";
        btn.style.borderRadius = "10px";

        const topLabel = `#${puzzleNum}`;
        const check = progress?.solved ? "✓" : "";
        const timeLabel = progress?.solved ? formatTime(progress.bestTime) : "00.0s";

        if (progress?.solved) {
            btn.style.background = "#4caf50";
            btn.style.color = "white";
        } else {
            btn.style.background = "#e0e0e0";
            btn.style.color = "#333";
        }

        btn.innerHTML = `
            <div style="font-size:22px; font-weight:bold;">${topLabel} ${check}</div>
            <div style="font-size:16px; margin-top:6px;">${timeLabel}</div>
        `;

        btn.onclick = () => loadPuzzle(puzzleNum);

        container.appendChild(btn);
    }

    // --- SEPARATE NAVIGATION BAR (NOT IN GRID) ---
    const navBar = document.getElementById("puzzleNavBar");
    navBar.innerHTML = ""; // clear old nav buttons

    navBar.style.display = "flex";
    navBar.style.justifyContent = "center";
    navBar.style.gap = "12px";
    navBar.style.margin = "20px 0";

    if (page > 1) {
        const prev = document.createElement("button");
        prev.textContent = "<< Prev";
        prev.onclick = () => showPuzzleSelect(page - 1);
        navBar.appendChild(prev);
    }

    if (endIndex < allPuzzles.length) {
        const next = document.createElement("button");
        next.textContent = "Next >>";
        next.onclick = () => showPuzzleSelect(page + 1);
        navBar.appendChild(next);
    }
    const jumpBtn = document.createElement("button");
    jumpBtn.textContent = "First Unsolved >>";
    jumpBtn.onclick = jumpToFirstUnsolved;
    navBar.appendChild(jumpBtn);
    const resetBtn = document.createElement("button");
    resetBtn.textContent = "Reset";
    resetBtn.style.background = "#b71c1c";
    resetBtn.style.color = "white";
    resetBtn.onclick = resetAllProgress;
    navBar.appendChild(resetBtn);

    document.getElementById("puzzleOverlay").style.display = "flex";
}
function loadPuzzle(num) {
    currentPuzzle = num;
    document.getElementById("puzzleOverlay").style.display = "none";
    // Show puzzle number
    document.getElementById("puzzleNumberHeader").textContent = "#" + num;

   
   

    // --- RESET GAME STATE ---
    buildToolboxLayout();                 // same as rollAll()
    clearHighlights();                    // same as rollAll()
    document.getElementById("winMessage").textContent = "";
    gameOver = false;

    // Clear old barriers
    document.querySelectorAll(".barrier").forEach(cell => {
        cell.classList.remove("barrier");
    });

    // --- LOAD PUZZLE SIGNATURE ---
    const signature = allPuzzles[num - 1];
    const coords = signature.split(",");

    let html = "";

    coords.forEach(coord => {
        html += `<div class="die"><strong>Barrier:</strong> ${coord}</div>`;
        const cell = document.getElementById(coord);
        if (cell) cell.classList.add( "barrier");   // SAME AS rollAll()
    });

    document.getElementById("results").innerHTML = html;

    updateDebugPanel();
    resetTimer();
    startTimer();
}
function closePuzzleOverlay() {
    document.getElementById("puzzleOverlay").style.display = "none";
}
function updateTimerDisplay() {
    const totalSeconds = Math.floor(timer / 1000);

    if (totalSeconds < 60) {
        // Under 1 minute → show "12.3s"
        document.getElementById("timerDisplay").textContent =
            (timer / 1000).toFixed(1) + "s";
        return;
    }

    // 1 minute or more → show "M:SS"
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    const formatted = `${minutes}m ${seconds.toString().padStart(2, "0")}s`;
    document.getElementById("timerDisplay").textContent = formatted;
}
function startTimer() {
    if (!timerRunning) {
        timerRunning = true;
        timerInterval = setInterval(() => {
            timer += 100; // update every 0.1s
            updateTimerDisplay();
        }, 100);
    }
}
function resetTimer() {
    clearInterval(timerInterval);
    timer = 0;
    timerRunning = false;
    updateTimerDisplay();
}
function stopTimer() {
    clearInterval(timerInterval);
    timerRunning = false;
}
function buildBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.id = rows[r] + cols[c];
          cell.innerText = "";
          board.appendChild(cell);
        }
      }
    }
function isSquareOccupied(row, col, exceptPiece = null) {
  const pieces = document.querySelectorAll(".piece");

  for (const piece of pieces) {
    if (piece === exceptPiece) continue;

    const shape = shapes[piece.dataset.shape];
    const rot = parseInt(piece.dataset.rotation);
    const rect = piece.getBoundingClientRect();
    const boardRect = document.getElementById("board").getBoundingClientRect();
    const padding = 0; // because your board padding is 0 now

    const anchorCol = Math.round((rect.left - boardRect.left - padding) / 66);
    const anchorRow = Math.round((rect.top  - boardRect.top  - padding) / 66);

    for (const [r, c] of shape.rotations[rot]) {
      if (anchorRow + r === row && anchorCol + c === col) {
        return true;
      }
    }
  }

  return false;
}
    
function snapPieceToGrid(piece) {
  const boardRect = document.getElementById("board").getBoundingClientRect();
  const parentRect = piece.offsetParent.getBoundingClientRect();

  const { anchorRow, anchorCol } = getPieceBoardCoords(piece);

  const padding = 20;
  const snappedLeft = (anchorCol * 60) + boardRect.left + padding;
  const snappedTop  = (anchorRow * 60) + boardRect.top  + padding;

  piece.style.left = (snappedLeft - parentRect.left) + "px";
  piece.style.top  = (snappedTop  - parentRect.top) + "px";
}
    
function highlightHoveredSquares(coords, piece) {
  // Remove old hover highlights
  document.querySelectorAll(".cell").forEach(cell => {
    cell.classList.remove("hover");
    cell.style.background = "";
  });

  const shape = shapes[piece.dataset.shape];
  const baseColor = shape.colors[0];
  const hoverColor = lightenColor(baseColor, 0.55); // 55% lighter

  coords.forEach(([r, c]) => {
    if (r >= 0 && r < 6 && c >= 0 && c < 6) {
      const cell = document.getElementById(`${String.fromCharCode(65+r)}${c+1}`);
      if (!cell.classList.contains("barrier")) {
        cell.classList.add("hover");
        cell.style.background = hoverColor;
      }
    }
  });
}
    
function buildToolboxLayout() {
  const toolbox = document.getElementById("toolbox");
  toolbox.innerHTML = ""; // Clear old pieces

  let offsetX = 0, offsetY = 0;

  Object.entries(shapes).forEach(([name, shape]) => {
    const piece = document.createElement("div");
    piece.classList.add("piece");
    piece.dataset.shape = name;
    piece.dataset.rotation = 0;

    // Build blocks
    shape.rotations[0].forEach((coord, i) => {
      const block = document.createElement("div");
      block.classList.add("block");
      block.style.background = shape.colors[0];
      block.style.left = coord[1] * 60 + "px";
      block.style.top = coord[0] * 60 + "px";
      block.style.position = "absolute";
      piece.appendChild(block);
    });

    // Position in toolbox grid
    piece.style.left = offsetX + "px";
    piece.style.top = offsetY + "px";

    offsetX += 140;
    if (offsetX > 300) {
      offsetX = 0;
      offsetY += 140;
    }

    toolbox.appendChild(piece);
    enablePieceInteraction(piece);
  });
}
    
function enablePieceInteraction(piece) {
  let startX, startY;
  let dragging = false;

  piece.addEventListener("pointerdown", e => {
    if (gameOver) return;
    dragging = false; // reset
    startX = e.clientX - piece.offsetLeft;
    startY = e.clientY - piece.offsetTop;
    piece.setPointerCapture(e.pointerId);
    piece.classList.add("lifted");

    piece.onpointermove = ev => {
      dragging = true;
      const x = ev.clientX - startX;
      const y = ev.clientY - startY;
      piece.style.left = x + "px";
      piece.style.top = (y - 240) + "px";

      const { coords } = getPieceBoardCoords(piece);

      highlightHoveredSquares(coords, piece);   // NEW

      updateDebugPanel();
     
    };

    piece.onpointerup = ev => {
  piece.releasePointerCapture(ev.pointerId);
  piece.onpointermove = null;
  piece.classList.remove("lifted");

  // Clear hover highlights
  document.querySelectorAll(".cell").forEach(cell => {
    cell.classList.remove("hover");
    cell.style.background = "";
  });

  const { coords } = getPieceBoardCoords(piece);

  // Snap only if valid
  if (isValidPlacement(coords,piece)) {
    snapPieceToGrid(piece);
  }

  updateDebugPanel();
  checkWinCondition();
};
  });

  piece.addEventListener("click", () => {
    // ⭐ If rotating instead of dragging, drop the lift immediately
  piece.classList.remove("lifted");
    if (!dragging) {
      rotatePiece(piece); // rotate ONLY if not dragging
      updateDebugPanel();
    }
    checkWinCondition();
  });
}
    
function lightenColor(hex, amount = 0.5) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) & 255;
  let g = (num >> 8) & 255;
  let b = num & 255;

  r = Math.round(r + (255 - r) * amount);
  g = Math.round(g + (255 - g) * amount);
  b = Math.round(b + (255 - b) * amount);

  return `rgb(${r}, ${g}, ${b})`;
}
    
function rotatePiece(piece) {
  const shape = shapes[piece.dataset.shape];
  let rot = parseInt(piece.dataset.rotation);
  rot = (rot + 1) % shape.rotations.length;
  piece.dataset.rotation = rot;

  [...piece.children].forEach((block, i) => {
    const [r, c] = shape.rotations[rot][i];
    block.style.left = c * 60 + "px";
    block.style.top = r * 60 + "px";
  });
}

function getPieceBoardCoords(piece) {
  const rect = piece.getBoundingClientRect();
  const boardRect = document.getElementById("board").getBoundingClientRect();

  const padding = 20; // board padding

  const anchorCol = Math.round((rect.left - boardRect.left - padding) / 60);
  const anchorRow = Math.round((rect.top - boardRect.top - padding) / 60);

  const shape = shapes[piece.dataset.shape];
  const rot = parseInt(piece.dataset.rotation);

  return {
    anchorRow,
    anchorCol,
    coords: shape.rotations[rot].map(([r, c]) => [anchorRow + r, anchorCol + c])
  };
}

function isValidPlacement(coords,piece) {
  for (const [r, c] of coords) {
    if (r < 0 || r > 5 || c < 0 || c > 5) return false;
    const cell = document.getElementById(`${String.fromCharCode(65+r)}${c+1}`);
    if (cell.classList.contains("barrier")) return false;
        // NEW: prevent overlapping other pieces
    if (isSquareOccupied(r, c, piece)) return false;
  }
  return true;
}

function clearHighlights() {
      document.querySelectorAll(".cell").forEach(cell => {
        cell.classList.remove("highlight");
      });
    }

function rollAll() {
      buildToolboxLayout();
      clearHighlights();
      document.getElementById("winMessage").textContent = "";
      gameOver = false;
      document.querySelectorAll(".barrier").forEach(cell => {
  cell.classList.remove("barrier");
});

      let html = "";
      dice.forEach(die => {
        const value = die.faces[Math.floor(Math.random() * die.faces.length)];
        html += `<div class="die"><strong>${die.name}:</strong> ${value}</div>`;

        const cell = document.getElementById(value);
        if (cell) cell.classList.add("barrier");
      });

      document.getElementById("results").innerHTML = html;
      updateDebugPanel();
      resetTimer();
      startTimer();
    }


function recordPuzzleWin(puzzleNumber, timeMs) {
    const prev = puzzleProgress[puzzleNumber];

    if (!prev || timeMs < prev.bestTime) {
        puzzleProgress[puzzleNumber] = { solved: true, bestTime: timeMs };
    }

    localStorage.setItem("puzzleProgress", JSON.stringify(puzzleProgress));
}

function savePuzzleProgress() {
    localStorage.setItem("puzzleProgress", JSON.stringify(puzzleProgress));
}
    
function checkWinCondition() {
  const boardRect = document.getElementById("board").getBoundingClientRect();
  const pieces = document.querySelectorAll(".piece");
  const padding = 20;

  const covered = new Set();

  pieces.forEach(piece => {
    const shape = shapes[piece.dataset.shape];
    const rot = parseInt(piece.dataset.rotation);

    const rect = piece.getBoundingClientRect();
    const anchorCol = Math.round((rect.left - boardRect.left - padding) / 60);
    const anchorRow = Math.round((rect.top - boardRect.top - padding) / 60);

    shape.rotations[rot].forEach(([r, c]) => {
      const row = anchorRow + r;
      const col = anchorCol + c;

      if (row >= 0 && row < 6 && col >= 0 && col < 6) {
        covered.add(`${row},${col}`);
      }
    });
  });

  // Check all non-barrier squares
  for (let r = 0; r < 6; r++) {
    for (let c = 0; c < 6; c++) {
      const cell = document.getElementById(`${String.fromCharCode(65+r)}${c+1}`);
      if (!cell.classList.contains("barrier")) {
        if (!covered.has(`${r},${c}`)) {
          return false;
        }
      }
    }
  }

  // --- WIN DETECTED ---
  stopTimer();
  gameOver = true;

  const timeMs = timer;
  const best = puzzleProgress[currentPuzzle]?.bestTime;

  // Save best time
  if (!best || timeMs < best) {
    puzzleProgress[currentPuzzle] = {
      solved: true,
      bestTime: timeMs
    };
    savePuzzleProgress();
  }

  // Show win screen
  const win = document.getElementById("winMessage");
  win.innerHTML = `
    🎉 Puzzle ${currentPuzzle} Complete!<br>
    Time: ${formatTime(timeMs)}<br><br>
    <button onclick="loadPuzzle(${currentPuzzle + 1})">Next Puzzle</button>
    <button onclick="showPuzzleSelect()">Select Puzzle</button>
  `;

  return true;
}
function formatTime(ms) {
    const totalSeconds = Math.floor(ms / 1000);

    if (totalSeconds < 60) {
        return (ms / 1000).toFixed(1) + "s";
    }

    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    return `${minutes}m ${seconds.toString().padStart(2, "0")}s`;
}
function updateDebugPanel() {
  const boardRect = document.getElementById("board").getBoundingClientRect();
  const pieces = document.querySelectorAll(".piece");
  const padding = 20; // board padding

  // Track coverage
  const covered = new Set();

  pieces.forEach(piece => {
    const shape = shapes[piece.dataset.shape];
    const rot = parseInt(piece.dataset.rotation);

    const rect = piece.getBoundingClientRect();
    const anchorCol = Math.round((rect.left - boardRect.left - padding) / 60);
    const anchorRow = Math.round((rect.top - boardRect.top - padding) / 60);

    shape.rotations[rot].forEach(([r, c]) => {
      const row = anchorRow + r;
      const col = anchorCol + c;

      if (row >= 0 && row < 6 && col >= 0 && col < 6) {
        covered.add(`${row},${col}`);
      }
    });
  });

  // Build readable output
  let out = "";
  for (let r = 0; r < 6; r++) {
    for (let c = 0; c < 6; c++) {
      const cell = document.getElementById(`${String.fromCharCode(65+r)}${c+1}`);

      if (cell.classList.contains("barrier")) {
        out += "[X]";
      } else if (covered.has(`${r},${c}`)) {
        out += "[■]";
      } else {
        out += "[□]";
      }
    }
    out += "<br>";
  }

  document.getElementById("debugPanel").innerHTML = out;
}
let allPuzzles = [];

function initGame() {
    fetch("puzzles.json")
        .then(r => r.json())
        .then(data => {
            allPuzzles = data;

            // Initialize puzzleProgress
            if (!puzzleProgress) puzzleProgress = {};

            for (let i = 1; i <= allPuzzles.length; i++) {
                if (!puzzleProgress[i]) {
                    puzzleProgress[i] = {
                        solved: false,
                        bestTime: null
                    };
                }
            }

            buildBoard();
            showPuzzleSelect();
        })
        .catch(err => {
            alert("Error loading puzzle data.");
            console.error(err);
        });
}

window.addEventListener("load", initGame);
  

  </script>

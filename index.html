<!DOCTYPE html>
<html>
<head>
  <title>Custom 7‑Dice Grid Roller</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 4px;
      margin: 20px auto;
      width: max-content;
    }

    .cell {
      width: 50px;
      height: 50px;
      background: white;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .highlight {
      background: yellow;
      font-weight: bold;
    }

    button {
      padding: 12px 25px;
      font-size: 1.2rem;
      margin-top: 20px;
      cursor: pointer;
    }

    .die {
      background: white;
      padding: 10px;
      margin: 10px auto;
      width: 250px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>
  <h1>Custom 7‑Dice Grid Roller</h1>
  <button onclick="rollAll()">Roll All Dice 🎲</button>

  <div id="results"></div>

  <h2>Grid (A–F top to bottom, 1–6 left to right)</h2>
  <div id="grid"></div>

  <script>
    const dice = [
      { name: "Die 1", faces: ["F2", "A5", "F2", "A5", "E1", "B6"] },
      { name: "Die 2", faces: ["F6", "A4", "D6", "C5", "C6", "B5"] },
      { name: "Die 3", faces: ["B2", "B1", "A3", "A2", "C2", "B3"] },
      { name: "Die 4", faces: ["D4", "B4", "E3", "C4", "C3", "D3"] },
      { name: "Die 5", faces: ["E6", "E5", "E4", "D5", "F5", "F4"] },
      { name: "Die 6", faces: ["C1", "A1", "D2", "D1", "F3", "E2"] },
      { name: "Die 7", faces: ["F1", "A6", "F1", "A6", "F1", "A6"] }
    ];

    const rows = ["A","B","C","D","E","F"];
    const cols = ["1","2","3","4","5","6"];

    function buildGrid() {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.id = rows[r] + cols[c];
          cell.innerText = rows[r] + cols[c];
          grid.appendChild(cell);
        }
      }
    }

    function clearHighlights() {
      document.querySelectorAll(".cell").forEach(cell => {
        cell.classList.remove("highlight");
      });
    }

    function rollAll() {
      clearHighlights();

      let html = "";
      dice.forEach(die => {
        const value = die.faces[Math.floor(Math.random() * die.faces.length)];
        html += `<div class="die"><strong>${die.name}:</strong> ${value}</div>`;

        const cell = document.getElementById(value);
        if (cell) cell.classList.add("highlight");
      });

      document.getElementById("results").innerHTML = html;
    }

    buildGrid();
  </script>
</body>
</html>
</body>
</html>
